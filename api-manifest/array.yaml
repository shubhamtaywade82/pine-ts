namespace: array
pineVersion: 6
status: partial
source: https://www.tradingview.com/pine-script-reference/v6/
types:
  "array<T>": PineArray<T>
  "array<int/float>": PineArray<number>
  "array<bool>": PineArray<boolean>
  "array<string>": PineArray<string>
