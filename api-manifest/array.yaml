      params:
        - { name: id, type: "array<int/float>" }
    returns: "array<int/float>"
    semantics:
      na: "new array with element-wise absolute values, na preserved; empty or all-na input returns na (undefined array id), per the v6 Arrays page blanket rule"
    impl: { module: src/array/core.ts, export: abs }
    status: draft
    vectors: [fixtures/v6/array/abs.basic.json]

  - name: avg
    signature:
      params:
        - { name: id, type: "array<int/float>" }
    returns: "series float"
    semantics:
      na: "skip-na: mean of non-na elements; na when empty or all elements na"
    impl: { module: src/array/statistics.ts, export: avg }
    status: draft
    vectors: [fixtures/v6/array/avg.basic.json]

  - name: binary_search
    signature:
      params:
        - { name: id, type: "array<int/float>" }
        - { name: val, type: "int/float" }
    returns: "series int"
    semantics:
      preconditions: "array sorted ascending and na-free (reference: correct results require it)"
      empty: "returns -1"
    impl: { module: src/array/statistics.ts, export: binary_search }
    status: draft
    vectors: [fixtures/v6/array/binary_search.basic.json]

  - name: binary_search_leftmost
    signature:
      params:
        - { name: id, type: "array<int/float>" }
        - { name: val, type: "int/float" }
    returns: "series int"
    semantics:
      found: "first index of val"
      absent: "index of the last element below val, or 0 when val sorts before the first element"
      empty: "returns 0"
    impl: { module: src/array/statistics.ts, export: binary_search_leftmost }
    status: draft
    vectors: [fixtures/v6/array/binary_search.basic.json]

  - name: binary_search_rightmost
    signature:
      params:
        - { name: id, type: "array<int/float>" }
        - { name: val, type: "int/float" }
    returns: "series int"
    semantics:
      found: "last index of val"
      absent: "first index above val, or size when val sorts after the last element"
      empty: "returns 0"
    impl: { module: src/array/statistics.ts, export: binary_search_rightmost }
    status: draft
    vectors: [fixtures/v6/array/binary_search.basic.json]

