namespace: ta
pineVersion: 6
status: partial
source: https://www.tradingview.com/pine-script-reference/v6/
types:
  float: number
  int: number
  bool: boolean
  string: string
  "series<float>": FloatSeries
  "series<int>": Series<number>
  "series<bool>": BooleanSeries
  "series<string>": Series<string>

functions:
  - name: sma
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { warmup: length - 1, na: "na source propagates" }
    impl: { module: src/ta/core.ts, export: sma }
    status: verified
    vectors: [fixtures/v6/ta/sma.basic.json]

  - name: ema
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { seed: "first non-na source value", alpha: "2 / (length + 1)" }
    impl: { module: src/ta/core.ts, export: ema }
    status: verified
    vectors: [fixtures/v6/ta/ema.basic.json]

  - name: rma
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { seed: "SMA of first length non-na values", alpha: "1 / length" }
    impl: { module: src/ta/core.ts, export: rma }
    status: draft
    vectors: [fixtures/v6/ta/rma.basic.json]

  - name: tr
    signature:
      params: [{ name: handle_na, type: bool }]
    returns: series<float>
    implicitSources: [high, low, close]
    semantics: { firstBar: "handle_na true uses high - low; false returns na" }
    impl: { module: src/ta/core.ts, export: tr }
    status: draft
    vectors: [fixtures/v6/ta/tr.basic.json]

  - name: atr
    signature:
      params: [{ name: length, type: int, constraints: { min: 1 } }]
    returns: series<float>
    implicitSources: [high, low, close]
    semantics: { core: "ta.rma(ta.tr(true), length)" }
    impl: { module: src/ta/core.ts, export: atr }
    status: draft
    vectors: [fixtures/v6/ta/atr.basic.json]

  - name: highest
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { warmup: length - 1 }
    impl: { module: src/ta/core.ts, export: highest }
    status: verified
    vectors: [fixtures/v6/ta/highest.basic.json]

  - name: lowest
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { warmup: length - 1 }
    impl: { module: src/ta/core.ts, export: lowest }
    status: verified
    vectors: [fixtures/v6/ta/lowest.basic.json]

  - name: change
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1, default: 1 } }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: change }
    status: verified
    vectors: [fixtures/v6/ta/change.basic.json]

  - name: crossover
    signature:
      params:
        - { name: source1, type: series<float> }
        - { name: source2, type: series<float> }
    returns: series<bool>
    semantics: { na: "any na operand yields false" }
    impl: { module: src/ta/core.ts, export: crossover }
    status: verified
    vectors: [fixtures/v6/ta/crossover.basic.json]

  - name: crossunder
    signature:
      params:
        - { name: source1, type: series<float> }
        - { name: source2, type: series<float> }
    returns: series<bool>
    impl: { module: src/ta/core.ts, export: crossunder }
    status: verified
    vectors: [fixtures/v6/ta/crossunder.basic.json]

  - name: wma
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: wma }
    status: draft
    vectors: [fixtures/v6/ta/wma.basic.json]

  - name: vwma
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: vwma }
    status: draft
    vectors: [fixtures/v6/ta/vwma.basic.json]

  - name: swma
    signature: { params: [{ name: source, type: series<float> }] }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: swma }
    status: draft
    vectors: [fixtures/v6/ta/swma.basic.json]

  - name: hma
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: hma }
    status: draft
    vectors: [fixtures/v6/ta/hma.basic.json]

  - name: rsi
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { core: "Wilder RMA of gains and losses" }
    impl: { module: src/ta/momentum.ts, export: rsi }
    status: draft
    vectors: [fixtures/v6/ta/rsi.basic.json]

  - name: roc
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { formula: "100 * (source - source[length]) / source[length]" }
    impl: { module: src/ta/momentum.ts, export: roc }
    status: draft
    vectors: [fixtures/v6/ta/roc.basic.json]

  - name: mom
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { formula: "source - source[length]" }
    impl: { module: src/ta/momentum.ts, export: mom }
    status: draft
    vectors: [fixtures/v6/ta/mom.basic.json]

  - name: stoch
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: peak, type: series<float> }
        - { name: valley, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    impl: { module: src/ta/momentum.ts, export: stoch }
    status: draft
    vectors: [fixtures/v6/ta/stoch.basic.json]

  - name: wpr
    signature: { params: [{ name: length, type: int, constraints: { min: 1 } }] }
    returns: series<float>
    implicitSources: [high, low, close]
    impl: { module: src/ta/momentum.ts, export: wpr }
    status: draft
    vectors: [fixtures/v6/ta/wpr.basic.json]

  - name: cmo
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { core: "Chande Momentum Oscillator" }
    impl: { module: src/ta/momentum.ts, export: cmo }
    status: draft
    vectors: [fixtures/v6/ta/cmo.basic.json]

  - name: variance
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: biased, type: bool, default: true }
    returns: series<float>
    semantics: { denominator: "length when biased, length - 1 otherwise" }
    impl: { module: src/ta/statistics.ts, export: variance }
    status: draft
    vectors: [fixtures/v6/ta/variance.basic.json]

  - name: stdev
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: biased, type: bool, default: true }
    returns: series<float>
    semantics: { core: "sqrt(ta.variance(source, length, biased))" }
    impl: { module: src/ta/statistics.ts, export: stdev }
    status: draft
    vectors: [fixtures/v6/ta/stdev.basic.json]

  - name: dev
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { core: "mean absolute deviation from the rolling SMA" }
    impl: { module: src/ta/statistics.ts, export: dev }
    status: draft
    vectors: [fixtures/v6/ta/dev.basic.json]

  - name: macd
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: fast_length, type: int, constraints: { min: 1 } }
        - { name: slow_length, type: int, constraints: { min: 1 } }
        - { name: signal_length, type: int, constraints: { min: 1 } }
    returns: "tuple(series<float>, series<float>, series<float>)"
    semantics:
      macdLine: "ta.ema(source, fast_length) - ta.ema(source, slow_length)"
      signalLine: "ta.ema(macdLine, signal_length)"
      histLine: "macdLine - signalLine"
      result: "MacdResult { macdLine, signalLine, histLine }"
      warmup: "defined from the first bar because the EMAs seed immediately"
    impl: { module: src/ta/composite.ts, export: macd }
    status: draft
    vectors: [fixtures/v6/ta/macd.basic.json]

  - name: bb
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: mult, type: float }
    returns: "tuple(series<float>, series<float>, series<float>)"
    semantics:
      middle: "ta.sma(source, length)"
      upper: "middle + mult * ta.stdev(source, length)"
      lower: "middle - mult * ta.stdev(source, length)"
      result: "BollingerBandsResult { middle, upper, lower }"
      warmup: "length - 1"
    impl: { module: src/ta/composite.ts, export: bb }
    status: draft
    vectors: [fixtures/v6/ta/bb.basic.json]

  - name: dmi
    signature:
      params:
        - { name: di_length, type: int, constraints: { min: 1 } }
        - { name: adx_smoothing, type: int, constraints: { min: 1 } }
    returns: "tuple(series<float>, series<float>, series<float>)"
    implicitSources: [high, low, close]
    semantics:
      plusDI: "100 * ta.rma(plusDM, di_length) / ta.rma(ta.tr, di_length)"
      minusDI: "100 * ta.rma(minusDM, di_length) / ta.rma(ta.tr, di_length)"
      adx: "100 * ta.rma(|plusDI - minusDI| / (plusDI + minusDI == 0 ? 1 : plusDI + minusDI), adx_smoothing)"
      directionalMovement: "up = ta.change(high); down = -ta.change(low); plus/minus when one dominates and is positive, else 0"
      result: "DmiResult { plusDI, minusDI, adx }"
      warmup: "plusDI/minusDI from bar di_length; adx from bar di_length + adx_smoothing - 1"
      na: "zero smoothed true range yields na DI values, matching Pine division by zero"
    impl: { module: src/ta/composite.ts, export: dmi }
    status: draft
    vectors: [fixtures/v6/ta/dmi.basic.json]

  - name: supertrend
    signature:
      params:
        [{ name: factor, type: float }, { name: atr_period, type: int, constraints: { min: 1 } }]
    returns: "tuple(series<float>, series<int>)"
    implicitSources: [high, low, close]
    semantics:
      bands: "hl2 +/- factor * ta.atr(atr_period) with carry-forward until the raw band tightens or the previous close breaks it"
      direction: "1 while the previous ATR is na; afterwards -1 when price holds above the trailing upper band (uptrend), 1 when below the lower band (downtrend)"
      warmup: "supertrend is na until ATR warms up; direction is 1 from the first bar"
      firstValidBand: "the first valid raw band is adopted directly, matching nz(band[1]) whenever the band is positive"
      result: "SupertrendResult { supertrend, direction }"
    impl: { module: src/ta/composite.ts, export: supertrend }
    status: draft
    vectors: [fixtures/v6/ta/supertrend.basic.json]

variables:
  barstate:
    type: namespace
    members: [isfirst, islast, ishistory, isrealtime, isnew, isconfirmed, islastconfirmedhistory]
  syminfo:
    type: namespace
    members: [ticker, tickerid, basecurrency, currency, mintick, timezone, type]
  ohlcv:
    type: source-bundle
    members: [open, high, low, close, volume, time, hl2, hlc3, ohlc4]

providerCapabilities:
  ohlcv:
    requiredBy: [ta.tr, ta.atr, request.security]
  fundamentals:
    requiredBy: [request.financial]
    missingBehavior: ProviderCapabilityError
