variables:
  barstate:
    type: namespace
    members: [isfirst, islast, ishistory, isrealtime, isnew, isconfirmed, islastconfirmedhistory]
  syminfo:
    type: namespace
    members: [ticker, tickerid, basecurrency, currency, mintick, timezone, type]
  ohlcv:
    type: source-bundle
    members: [open, high, low, close, volume, time, hl2, hlc3, hlcc4, ohlc4]

providerCapabilities:
  ohlcv:
    requiredBy:
      [
        ta.tr,
        ta.atr,
        ta.sar,
        ta.wpr,
        ta.kc,
        ta.kcw,
        ta.obv,
        ta.pvt,
        ta.pvi,
        ta.nvi,
        ta.mfi,
        ta.vwap,
        ta.accdist,
        ta.iii,
        ta.wad,
        ta.wvad,
        request.security,
      ]
  fundamentals:
    requiredBy: [request.financial]
    missingBehavior: ProviderCapabilityError
