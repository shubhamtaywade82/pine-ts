namespace: ta
pineVersion: 6
status: partial
source: https://www.tradingview.com/pine-script-reference/v6/
types:
  float: number
  int: number
  bool: boolean
  string: string
  "series<float>": FloatSeries
  "series<int>": Series<number>
  "series<bool>": BooleanSeries
  "series<string>": Series<string>

functions:
  - name: sma
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { warmup: length - 1, na: "na source propagates" }
    impl: { module: src/ta/core.ts, export: sma }
    status: verified
    vectors: [fixtures/v6/ta/sma.basic.json]

  - name: ema
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { seed: "first non-na source value", alpha: "2 / (length + 1)" }
    impl: { module: src/ta/core.ts, export: ema }
    status: verified
    vectors: [fixtures/v6/ta/ema.basic.json]

  - name: rma
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics: { seed: "SMA of first length non-na values", alpha: "1 / length" }
    impl: { module: src/ta/core.ts, export: rma }
    status: draft
    vectors: [fixtures/v6/ta/rma.basic.json]

  - name: tr
    signature:
      params: [{ name: handle_na, type: bool }]
    returns: series<float>
    implicitSources: [high, low, close]
    semantics: { firstBar: "handle_na true uses high - low; false returns na" }
    impl: { module: src/ta/core.ts, export: tr }
    status: draft
    vectors: [fixtures/v6/ta/tr.basic.json]

  - name: atr
    signature:
      params: [{ name: length, type: int, constraints: { min: 1 } }]
    returns: series<float>
    implicitSources: [high, low, close]
    semantics: { core: "ta.rma(ta.tr(true), length)" }
    impl: { module: src/ta/core.ts, export: atr }
    status: draft
    vectors: [fixtures/v6/ta/atr.basic.json]

  - name: highest
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      warmup: length - 1
      na: "v6 remark: na values are ignored; the window collects the last length non-na values, and a na current value yields na"
    impl: { module: src/ta/core.ts, export: highest }
    status: verified
    vectors: [fixtures/v6/ta/highest.basic.json, fixtures/v6/ta/highest.na.json]

  - name: lowest
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      warmup: length - 1
      na: "v6 remark: na values are ignored; the window collects the last length non-na values, and a na current value yields na"
    impl: { module: src/ta/core.ts, export: lowest }
    status: verified
    vectors: [fixtures/v6/ta/lowest.basic.json]

  - name: change
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1, default: 1 } }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: change }
    status: verified
    vectors: [fixtures/v6/ta/change.basic.json]

  - name: crossover
    signature:
      params:
        - { name: source1, type: series<float> }
        - { name: source2, type: series<float> }
    returns: series<bool>
    semantics: { na: "any na operand yields false" }
    impl: { module: src/ta/core.ts, export: crossover }
    status: verified
    vectors: [fixtures/v6/ta/crossover.basic.json]

  - name: crossunder
    signature:
      params:
        - { name: source1, type: series<float> }
        - { name: source2, type: series<float> }
    returns: series<bool>
    impl: { module: src/ta/core.ts, export: crossunder }
    status: verified
    vectors: [fixtures/v6/ta/crossunder.basic.json]

  - name: cross
    signature:
      params:
        - { name: source1, type: series<float> }
        - { name: source2, type: series<float> }
    returns: series<bool>
    semantics:
      core: "true when the series crossed each other on the current bar, i.e. a crossover or a crossunder"
      na: "any na operand yields false, matching the verified crossover/crossunder model"
    impl: { module: src/ta/core.ts, export: cross }
    status: draft
    vectors: [fixtures/v6/ta/cross.basic.json]

  - name: cum
    signature: { params: [{ name: source, type: series<float> }] }
    returns: series<float>
    semantics:
      core: "cumulative (total) sum of source from the first bar"
      na: "the v6 reference documents no na remark; pine-ts follows the established cumulative convention (ta.obv, ta.accdist): na terms are skipped and the empty sum is 0"
    impl: { module: src/ta/core.ts, export: cum }
    status: draft
    vectors: [fixtures/v6/ta/cum.basic.json]

  - name: max
    signature: { params: [{ name: source, type: series<float> }] }
    returns: series<float>
    semantics:
      core: "all-time high of source from the beginning of the chart up to the current bar"
      na: "v5/v6 remark: na occurrences of source are ignored, so na bars carry the previous extreme forward; na until the first non-na value"
    impl: { module: src/ta/core.ts, export: max }
    status: draft
    vectors: [fixtures/v6/ta/max.basic.json]

  - name: min
    signature: { params: [{ name: source, type: series<float> }] }
    returns: series<float>
    semantics:
      core: "all-time low of source from the beginning of the chart up to the current bar"
      na: "same model as ta.max"
    impl: { module: src/ta/core.ts, export: min }
    status: draft
    vectors: [fixtures/v6/ta/min.basic.json]

  - name: wma
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: wma }
    status: draft
    vectors: [fixtures/v6/ta/wma.basic.json]

  - name: vwma
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: vwma }
    status: draft
    vectors: [fixtures/v6/ta/vwma.basic.json]

  - name: swma
    signature: { params: [{ name: source, type: series<float> }] }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: swma }
    status: draft
    vectors: [fixtures/v6/ta/swma.basic.json]

  - name: hma
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    impl: { module: src/ta/core.ts, export: hma }
    status: draft
    vectors: [fixtures/v6/ta/hma.basic.json]

  - name: alma
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: offset, type: float }
        - { name: sigma, type: float }
        - { name: floor, type: bool, default: false }
    returns: series<float>
    semantics:
      core: "literal transcription of the v6 reference re-implementation: Gaussian weights exp(-((i - m)^2) / (2 s^2)) with m = offset * (length - 1) (floored when floor is true) and s = length / sigma; weight i pairs with source[length - i - 1]"
      floor: "the reference documents floor as 'An optional parameter. Specifies whether the offset calculation is floored before ALMA is calculated. Default value is false.'"
      na: "v6 remark: na values in the source series are included in calculations and will produce an na result, so the window is strict"
      zero: "a zero sigma divides to na"
      warmup: "length - 1"
    impl: { module: src/ta/core.ts, export: alma }
    status: draft
    vectors: [fixtures/v6/ta/alma.basic.json]

  - name: rsi
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { core: "Wilder RMA of gains and losses" }
    impl: { module: src/ta/momentum.ts, export: rsi }
    status: draft
    vectors: [fixtures/v6/ta/rsi.basic.json]

  - name: roc
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { formula: "100 * (source - source[length]) / source[length]" }
    impl: { module: src/ta/momentum.ts, export: roc }
    status: draft
    vectors: [fixtures/v6/ta/roc.basic.json]

  - name: mom
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { formula: "source - source[length]" }
    impl: { module: src/ta/momentum.ts, export: mom }
    status: draft
    vectors: [fixtures/v6/ta/mom.basic.json]

  - name: stoch
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: peak, type: series<float> }
        - { name: valley, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    impl: { module: src/ta/momentum.ts, export: stoch }
    status: draft
    vectors: [fixtures/v6/ta/stoch.basic.json]

  - name: wpr
    signature: { params: [{ name: length, type: int, constraints: { min: 1 } }] }
    returns: series<float>
    implicitSources: [high, low, close]
    impl: { module: src/ta/momentum.ts, export: wpr }
    status: draft
    vectors: [fixtures/v6/ta/wpr.basic.json]

  - name: cmo
    signature:
      {
        params:
          [
            { name: source, type: series<float> },
            { name: length, type: int, constraints: { min: 1 } },
          ],
      }
    returns: series<float>
    semantics: { core: "Chande Momentum Oscillator" }
    impl: { module: src/ta/momentum.ts, export: cmo }
    status: draft
    vectors: [fixtures/v6/ta/cmo.basic.json]

  - name: cci
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "(source - SMA(source, length)) / (0.015 * mean absolute deviation), the Lambert scaling the v6 reference describes"
      na: "v6 remark: na values in the source series are ignored; a zero mean deviation divides to na"
      warmup: "length - 1"
    impl: { module: src/ta/momentum.ts, export: cci }
    status: draft
    vectors: [fixtures/v6/ta/cci.basic.json]

  - name: cog
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "literal transcription of the v6 reference re-implementation: -sum(price * (i + 1)) / sum(price) over bar offsets i = 0 to length - 1"
      na: "v6 remark: na values are ignored; weights apply positionally to the collected non-na values (1 for the most recent, length for the oldest); a zero sum divides to na"
      warmup: "length - 1"
    impl: { module: src/ta/momentum.ts, export: cog }
    status: draft
    vectors: [fixtures/v6/ta/cog.basic.json]

  - name: tsi
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: short_length, type: int, constraints: { min: 1 } }
        - { name: long_length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "ema(ema(change(source), long_length), short_length) / ema(ema(abs(change(source)), long_length), short_length)"
      range: "the v6 reference pins the return range as [-1, 1], so pine-ts applies no 100 scale factor"
      na: "v6 remark: na values are ignored; carried by the EMA seeding, so the first bar's na momentum yields na; a zero double-smoothed absolute momentum divides to na"
      provenance: "the v6 reference ships no re-implementation; the nested-EMA structure follows the double-smoothing in TradingView's built-in True Strength Index indicator"
    impl: { module: src/ta/momentum.ts, export: tsi }
    status: draft
    vectors: [fixtures/v6/ta/tsi.basic.json]

  - name: variance
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: biased, type: bool, default: true }
    returns: series<float>
    semantics:
      denominator: "length when biased, length - 1 otherwise"
      na: "v6 remark: na values are ignored; the window collects the last length non-na values"
    impl: { module: src/ta/statistics.ts, export: variance }
    status: draft
    vectors: [fixtures/v6/ta/variance.basic.json]

  - name: stdev
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: biased, type: bool, default: true }
    returns: series<float>
    semantics:
      core: "sqrt(ta.variance(source, length, biased))"
      na: "v6 remark: na values are ignored; the window collects the last length non-na values"
    impl: { module: src/ta/statistics.ts, export: stdev }
    status: draft
    vectors: [fixtures/v6/ta/stdev.basic.json, fixtures/v6/ta/stdev.na.json]

  - name: dev
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "mean absolute deviation from the rolling SMA"
      na: "v6 remark: na values are ignored; the window collects the last length non-na values"
    impl: { module: src/ta/statistics.ts, export: dev }
    status: draft
    vectors: [fixtures/v6/ta/dev.basic.json]

  - name: median
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "median of the window; an even-sized window averages its two middle values"
      overloads: "the v6 reference lists series<int> and series<float> overloads; the TypeScript number type covers both"
      na: "v6 remark: na values in the source series are ignored; the function calculates on the length quantity of non-na values"
    impl: { module: src/ta/statistics.ts, export: median }
    status: draft
    vectors: [fixtures/v6/ta/median.basic.json]

  - name: mode
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "most frequently occurring value in the window"
      ties: "v6 reference: several values with the same frequency return the smallest; with every value occurring once the smallest already wins the tie"
      na: "v6 remark: na values are ignored; the function calculates on the length quantity of non-na values"
    impl: { module: src/ta/statistics.ts, export: mode }
    status: draft
    vectors: [fixtures/v6/ta/mode.basic.json]

  - name: range
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "difference between the max and min values in the window"
      na: "v6 remark: na values are ignored; the function calculates on the length quantity of non-na values"
    impl: { module: src/ta/statistics.ts, export: range }
    status: draft
    vectors: [fixtures/v6/ta/range.basic.json]

  - name: percentile_nearest_rank
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: percentage, type: float, constraints: { min: 0, max: 100 } }
    returns: series<float>
    semantics:
      core: "nearest-rank percentile: rank = ceil(percentage / 100 * length), clamped into the window"
      properties: "v6 remarks: the result is always a member of the input data set and the 100th percentile is the largest value"
      na: "v6 remark: na values in the source series are ignored"
    impl: { module: src/ta/statistics.ts, export: percentileNearestRank }
    status: draft
    vectors: [fixtures/v6/ta/percentile_nearest_rank.basic.json]

  - name: percentile_linear_interpolation
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: percentage, type: float, constraints: { min: 0, max: 100 } }
    returns: series<float>
    semantics:
      core: "linear interpolation between the two nearest ranks at position (percentage / 100) * (length - 1) on the sorted window"
      properties: "v6 remark: a percentile calculated using this method will NOT always be a member of the input data set"
      na: "v6 remark: na values in the source series are included in calculations and will produce an na result, so the window is strict"
    impl: { module: src/ta/statistics.ts, export: percentileLinearInterpolation }
    status: draft
    vectors: [fixtures/v6/ta/percentile_linear_interpolation.basic.json]

  - name: percentrank
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "percent of window values less than or equal to the current value"
      window: "the count includes the current bar (the standard weak percent-rank convention, where a new window extreme reads 100); the v6 reference ships no re-implementation, so this choice is pinned here until oracle vectors land"
      na: "v6 remark: na values in the source series are included in calculations and will produce an na result, so the window is strict"
    impl: { module: src/ta/statistics.ts, export: percentrank }
    status: draft
    vectors: [fixtures/v6/ta/percentrank.basic.json]

  - name: correlation
    signature:
      params:
        - { name: source1, type: series<float> }
        - { name: source2, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "Pearson correlation coefficient over the last length bars where both sources are non-na (pairs stay bar-aligned)"
      na: "v6 remark: na values in the source series are ignored; the function calculates on the length quantity of non-na values; a na current value on either side yields na"
      zero: "a zero variance on either side divides to na"
    impl: { module: src/ta/statistics.ts, export: correlation }
    status: draft
    vectors: [fixtures/v6/ta/correlation.basic.json]

  - name: rci
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    semantics:
      core: "Spearman rank correlation between the source and the bar index over the window, scaled to [-100, 100]; ranks use the pairwise comparison convention with 0.5 tie contributions, and the time rank orders the most recent bar highest"
      range: "v6 reference: 100 indicates the source consistently increased, -100 consistently decreased"
      na: "the v6 reference documents no na remark for ta.rci; pine-ts uses a strict window (any na in the last length bars yields na) because pairing source ranks with bar-index ranks is only meaningful on contiguous bars"
    impl: { module: src/ta/statistics.ts, export: rci }
    status: draft
    vectors: [fixtures/v6/ta/rci.basic.json]

  - name: macd
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: fast_length, type: int, constraints: { min: 1 } }
        - { name: slow_length, type: int, constraints: { min: 1 } }
        - { name: signal_length, type: int, constraints: { min: 1 } }
    returns: "tuple(series<float>, series<float>, series<float>)"
    semantics:
      macdLine: "ta.ema(source, fast_length) - ta.ema(source, slow_length)"
      signalLine: "ta.ema(macdLine, signal_length)"
      histLine: "macdLine - signalLine"
      result: "MacdResult { macdLine, signalLine, histLine }"
      warmup: "defined from the first bar because the EMAs seed immediately"
    impl: { module: src/ta/composite.ts, export: macd }
    status: draft
    vectors: [fixtures/v6/ta/macd.basic.json]

  - name: bb
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: mult, type: float }
    returns: "tuple(series<float>, series<float>, series<float>)"
    semantics:
      middle: "ta.sma(source, length)"
      upper: "middle + mult * ta.stdev(source, length)"
      lower: "middle - mult * ta.stdev(source, length)"
      result: "BollingerBandsResult { middle, upper, lower }"
      warmup: "length - 1"
    impl: { module: src/ta/composite.ts, export: bb }
    status: draft
    vectors: [fixtures/v6/ta/bb.basic.json]

  - name: dmi
    signature:
      params:
        - { name: di_length, type: int, constraints: { min: 1 } }
        - { name: adx_smoothing, type: int, constraints: { min: 1 } }
    returns: "tuple(series<float>, series<float>, series<float>)"
    implicitSources: [high, low, close]
    semantics:
      plusDI: "100 * ta.rma(plusDM, di_length) / ta.rma(ta.tr, di_length)"
      minusDI: "100 * ta.rma(minusDM, di_length) / ta.rma(ta.tr, di_length)"
      adx: "100 * ta.rma(|plusDI - minusDI| / (plusDI + minusDI == 0 ? 1 : plusDI + minusDI), adx_smoothing)"
      directionalMovement: "up = ta.change(high); down = -ta.change(low); plus/minus when one dominates and is positive, else 0"
      result: "DmiResult { plusDI, minusDI, adx }"
      warmup: "plusDI/minusDI from bar di_length; adx from bar di_length + adx_smoothing - 1"
      na: "zero smoothed true range yields na DI values, matching Pine division by zero"
    impl: { module: src/ta/composite.ts, export: dmi }
    status: draft
    vectors: [fixtures/v6/ta/dmi.basic.json]

  - name: supertrend
    signature:
      params:
        [{ name: factor, type: float }, { name: atr_period, type: int, constraints: { min: 1 } }]
    returns: "tuple(series<float>, series<int>)"
    implicitSources: [high, low, close]
    semantics:
      bands: "hl2 +/- factor * ta.atr(atr_period) with carry-forward until the raw band tightens or the previous close breaks it"
      direction: "1 while the previous ATR is na; afterwards -1 when price holds above the trailing upper band (uptrend), 1 when below the lower band (downtrend)"
      warmup: "supertrend is na until ATR warms up; direction is 1 from the first bar"
      firstValidBand: "the first valid raw band is adopted directly, matching nz(band[1]) whenever the band is positive"
      result: "SupertrendResult { supertrend, direction }"
    impl: { module: src/ta/composite.ts, export: supertrend }
    status: draft
    vectors: [fixtures/v6/ta/supertrend.basic.json]

  - name: sar
    signature:
      params:
        - { name: start, type: float }
        - { name: increment, type: float }
        - { name: maximum, type: float }
    returns: series<float>
    implicitSources: [high, low, close]
    semantics:
      algorithm: "literal transcription of the pine_sar re-implementation from the v6 Reference Manual entry"
      warmup: "na on bar 0; bar 1 seeds the trend from close vs close[1] with the SAR at the previous bar's opposite extreme"
      perBar: "acceleration step toward the extreme point, reversal when price crosses the SAR (reset to the opposite extreme), extreme/acceleration advance on continuing trends (increment capped at maximum), then clamp within the last two bars' lows (uptrend) or highs (downtrend)"
      na: "na comparisons are false, so na inputs flow through like Pine"
    impl: { module: src/ta/trend.ts, export: sar }
    status: draft
    vectors: [fixtures/v6/ta/sar.basic.json, fixtures/v6/ta/sar.cap.json]

  - name: linreg
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: offset, type: int }
    returns: series<float>
    semantics:
      core: "intercept + slope * (length - 1 - offset) from the least-squares fit over the last length bars with x = 0 at the oldest bar"
      offset: "0 returns the line value at the current bar; length - 1 at the window start; other integers extrapolate"
      warmup: "length - 1"
      na: "na values in the window are included in the calculation and produce an na result"
    impl: { module: src/ta/trend.ts, export: linreg }
    status: draft
    vectors: [fixtures/v6/ta/linreg.basic.json, fixtures/v6/ta/linreg.start.json]

  - name: bbw
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: mult, type: float }
    returns: series<float>
    semantics:
      core: "(((basis + dev) - (basis - dev)) / basis) * 100 with basis = ta.sma(source, length), dev = mult * ta.stdev(source, length)"
      scale: "the v6 reference re-implementation multiplies by 100, so the result is a percentage"
      warmup: "length - 1"
      na: "inherited from the sma/stdev windows; a zero basis divides to na"
    impl: { module: src/ta/bands.ts, export: bbw }
    status: draft
    vectors: [fixtures/v6/ta/bbw.basic.json]

  - name: kc
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: mult, type: float }
        - { name: useTrueRange, type: bool, default: true }
    returns: "tuple(series<float>, series<float>, series<float>)"
    implicitSources: [high, low, close]
    semantics:
      basis: "ta.ema(source, length)"
      span: "ta.tr when useTrueRange, otherwise (high - low)"
      rangeEma: "ta.ema(span, length)"
      bands: "[basis, basis + rangeEma * mult, basis - rangeEma * mult]"
      result: "KeltnerChannelsResult { middle, upper, lower }"
      warmup: "defined from the first bar because the EMAs seed immediately"
    impl: { module: src/ta/bands.ts, export: kc }
    status: draft
    vectors: [fixtures/v6/ta/kc.basic.json, fixtures/v6/ta/kc.range.json]

  - name: kcw
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
        - { name: mult, type: float }
        - { name: useTrueRange, type: bool, default: true }
    returns: series<float>
    implicitSources: [high, low, close]
    semantics:
      core: "((basis + rangeEma * mult) - (basis - rangeEma * mult)) / basis from the ta.kc components"
      scale: "unlike ta.bbw the v6 reference re-implementation has no * 100 here"
      na: "a zero basis divides to na"
    impl: { module: src/ta/bands.ts, export: kcw }
    status: draft
    vectors: [fixtures/v6/ta/kcw.basic.json]

  - name: obv
    signature: { params: [] }
    returns: series<float>
    implicitSources: [close, volume]
    semantics:
      core: "ta.cum(math.sign(ta.change(close)) * volume) per the official v6 re-implementation"
      na: "a na change (first bar or na close) or na volume contributes nothing, matching cum() skipping na terms"
      firstBar: "0"
    impl: { module: src/ta/volume.ts, export: obv }
    status: draft
    vectors: [fixtures/v6/ta/obv.basic.json]

  - name: pvt
    signature: { params: [] }
    returns: series<float>
    implicitSources: [close, volume]
    semantics:
      core: "ta.cum((ta.change(close) / close[1]) * volume) per the official v6 re-implementation"
      na: "a zero previous close divides to na, so the bar contributes nothing"
      firstBar: "0"
    impl: { module: src/ta/volume.ts, export: pvt }
    status: draft
    vectors: [fixtures/v6/ta/pvt.basic.json]

  - name: pvi
    signature: { params: [] }
    returns: series<float>
    implicitSources: [close, volume]
    semantics:
      core: "seeds at 1.0 and updates only when volume > volume[1]: prev + ((close - close[1]) / close[1]) * prev"
      carry: "a zero or na close on either side carries the previous value; a na current volume makes the comparison false"
      seed: "nz(prev, 0) == 0 promotes back to the 1.0 seed"
    impl: { module: src/ta/volume.ts, export: pvi }
    status: draft
    vectors: [fixtures/v6/ta/pvi.basic.json]

  - name: nvi
    signature: { params: [] }
    returns: series<float>
    implicitSources: [close, volume]
    semantics:
      core: "seeds at 1.0 and updates only when volume < volume[1]: prev + ((close - close[1]) / close[1]) * prev"
      carry: "same carry rules as ta.pvi"
    impl: { module: src/ta/volume.ts, export: nvi }
    status: draft
    vectors: [fixtures/v6/ta/nvi.basic.json]

  - name: mfi
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<float>
    implicitSources: [volume]
    semantics:
      core: "official v6 re-implementation with math.sum windows, not Wilder smoothing"
      upper: "math.sum(volume * (ta.change(source) <= 0 ? 0 : source), length)"
      lower: "math.sum(volume * (ta.change(source) >= 0 ? 0 : source), length)"
      value: "100 - 100 / (1 + upper / lower)"
      naComparisons: "Pine v6 comparisons against na are false, so the first bar's na change adds volume * source to BOTH windows"
      na: "na when the window holds fewer than length non-na flows, and na when lower = 0 (division by zero)"
      warmup: "first value on bar length - 1"
    impl: { module: src/ta/volume.ts, export: mfi }
    status: draft
    vectors: [fixtures/v6/ta/mfi.basic.json]

  - name: vwap
    signature:
      params:
        - { name: source, type: series<float> }
        - {
            name: anchor,
            type: series<bool>,
            default: "daily boundary change in the symbol timezone",
          }
    returns: series<float>
    implicitSources: [volume, time]
    semantics:
      core: "anchored cumulative sum(source * volume) / sum(volume)"
      anchor: "the anchor condition resets the sums; the anchor bar itself starts the new accumulation window"
      default: "v6 documents the default anchor as timeframe.change('1D'); pine-ts derives it from bar times and the symbol timezone"
      na: "na until the first anchor fires; bars with a na source or na volume contribute nothing"
      planned: "the stdev_mult tuple overload [vwap, upper, lower] is planned and not shipped because the v6 reference does not document the band formula"
    impl: { module: src/ta/volume.ts, export: vwap }
    status: draft
    vectors: [fixtures/v6/ta/vwap.basic.json, fixtures/v6/ta/vwap.anchor.json]

  - name: accdist
    signature: { params: [] }
    returns: series<float>
    implicitSources: [high, low, close, volume]
    semantics:
      core: "ta.cum(((close - low) - (high - close)) / (high - low) * volume), the standard Chaikin accumulation/distribution line"
      provenance: "the v6 reference entry documents the variable but ships no re-implementation, so the formula follows the TradingView chart indicator"
      na: "a zero bar range divides to na, so the bar contributes nothing"
    impl: { module: src/ta/volume.ts, export: accdist }
    status: draft
    vectors: [fixtures/v6/ta/accdist.basic.json]

  - name: iii
    signature: { params: [] }
    returns: series<float>
    implicitSources: [high, low, close, volume]
    semantics:
      core: "literal transcription of the v6 reference re-implementation: ((2 * close - high - low) / (high - low)) * volume"
      perBar: "the value is the per-bar intensity, not a cumulative total"
      na: "a zero bar range divides to na; na inputs propagate na"
    impl: { module: src/ta/volume.ts, export: iii }
    status: draft
    vectors: [fixtures/v6/ta/iii.basic.json]

  - name: wad
    signature: { params: [] }
    returns: series<float>
    implicitSources: [high, low, close]
    semantics:
      core: "literal transcription of the v6 reference re-implementation: ta.cum(gain) with trueHigh = max(high, close[1]), trueLow = min(low, close[1]), gain = mom > 0 ? close - trueLow : mom < 0 ? close - trueHigh : 0"
      na: "Pine v6 comparisons against na are false, so the first bar's na change contributes nothing; na true-high/true-low components make the gain na, which cum() skips"
    impl: { module: src/ta/volume.ts, export: wad }
    status: draft
    vectors: [fixtures/v6/ta/wad.basic.json]

  - name: wvad
    signature: { params: [] }
    returns: series<float>
    implicitSources: [open, high, low, close, volume]
    semantics:
      core: "literal transcription of the v6 reference re-implementation: (close - open) / (high - low) * volume"
      perBar: "the value is the per-bar intensity, not a cumulative total"
      na: "a zero bar range divides to na; na inputs propagate na"
    impl: { module: src/ta/volume.ts, export: wvad }
    status: draft
    vectors: [fixtures/v6/ta/wvad.basic.json]

  - name: pivot_point_levels
    signature:
      params:
        - { name: type, type: series<string> }
        - { name: anchor, type: series<bool> }
        - { name: developing, type: bool, default: false }
    returns: array<float>
    semantics:
      core: "pivot point levels for Traditional, Fibonacci, Woodie, Classic, DM, and Camarilla types, reset by the anchor condition"
      levels: "an array of 11 levels [P, R1, S1, R2, S2, R3, S3, R4, S4, R5, S5] per the v6 reference; levels a type does not define stay na"
      formulas: "TradingView's own Pivot Points Standard definitions (support article 43000521824); Woodie uses the current period's open, DM's doji check compares the completed period's open and close"
      anchor: "on an anchor bar the levels come from the period that just closed; developing=true recalculates on the running period (bars since the last anchor, or bar zero when no anchor has fired)"
      errors: "developing with type Woodie raises a runtime error (the v6 reference contract)"
      pineTs: "returns the current bar's PineArray<number> directly (Pine-shaped array.get usage); the accumulation lives in a session-owned node with the evaluate/commit split, so realtime revisions roll back cleanly"
    impl: { module: src/ta/pivot.ts, export: pivotPointLevels }
    status: draft
    vectors:
      - fixtures/v6/array/pivot_traditional.basic.json
      - fixtures/v6/array/pivot_classic.basic.json
      - fixtures/v6/array/pivot_woodie.basic.json
      - fixtures/v6/array/pivot_dm.basic.json
      - fixtures/v6/array/pivot_camarilla.basic.json
      - fixtures/v6/array/pivot_camarilla_developing.basic.json

  - name: barssince
    signature:
      params:
        - { name: condition, type: series<bool> }
    returns: series<int>
    semantics:
      value: "0 when the condition holds on the current bar; the bar distance to the last true bar otherwise"
