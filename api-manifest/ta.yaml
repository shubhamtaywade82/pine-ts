    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<int>
    semantics:
      core: "offset to the lowest bar over the last length non-na values, reported as a negative bar count"
      ties: "same most-recent tie rule as ta.highestbars"
      na: "same model as ta.highestbars"
    impl: { module: src/ta/events.ts, export: lowestbars }
    status: draft
    vectors: [fixtures/v6/ta/lowestbars.basic.json]

  - name: pivothigh
    signature:
      params:
        - { name: source, type: series<float> }
