        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<bool>
    semantics:
      core: "strictly increasing chain over the current value and the last length non-na prior values"
      na: "v6 remark: na values are ignored; the function calculates on the length quantity of non-na values, and a na current value yields false"
      warmup: "false until length non-na prior values exist"
    impl: { module: src/ta/events.ts, export: rising }
    status: draft
    vectors: [fixtures/v6/ta/rising.basic.json]

  - name: falling
    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<bool>
    semantics:
      core: "strictly decreasing chain over the current value and the last length non-na prior values"
      na: "same model as ta.rising"
    impl: { module: src/ta/events.ts, export: falling }
    status: draft
    vectors: [fixtures/v6/ta/falling.basic.json]

  - name: valuewhen
    signature:
      params:
        - { name: condition, type: series<bool> }
        - { name: source, type: series<float> }
        - { name: occurrence, type: int, constraints: { min: 0 } }
    returns: series<float>
    semantics:
      core: "value of source on the nth most recent bar where condition was true; 0 is the most recent occurrence and the current bar counts"
      na: "na until enough occurrences exist"
      pineTs: "generic over the source value type; na surfaces as undefined on Series<T>"
    impl: { module: src/ta/events.ts, export: valuewhen }
    status: draft
    vectors: [fixtures/v6/ta/valuewhen.basic.json]

