    signature:
      params:
        - { name: source, type: series<float> }
        - { name: length, type: int, constraints: { min: 1 } }
    returns: series<int>
    semantics:
      core: "offset to the highest bar over the last length non-na values, reported as a negative bar count"
      ties: "the v6 reference does not document tie-breaking; pine-ts resolves ties toward the most recent bar (offset closest to zero)"
      na: "na during warm-up or on a na current value; numeric na surfaces as FloatSeries NaN"
    impl: { module: src/ta/events.ts, export: highestbars }
    status: draft
    vectors: [fixtures/v6/ta/highestbars.basic.json]

