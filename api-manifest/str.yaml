    impl: { module: src/str/core.ts, export: pos }
    status: draft
    vectors: [fixtures/v6/str/pos.basic.json]

  - name: repeat
    signature:
      params:
        - { name: source, type: string }
        - { name: repeat, type: int, constraints: { min: 0 } }
