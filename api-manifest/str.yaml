        - { name: occurrence, type: int, default: 0 }
    returns: string
    semantics:
      occurrence: "N-th occurrence, zero-indexed; non-overlapping scan; fewer occurrences than requested leaves the source unchanged"
      na: "na source yields na"
    impl: { module: src/str/core.ts, export: replace }
    status: draft
    vectors: [fixtures/v6/str/replace.basic.json]

  - name: replace_all
    signature:
      params:
        - { name: source, type: string }
        - { name: target, type: string }
        - { name: replacement, type: string }
    returns: string
    semantics:
      na: "na source yields na"
      emptyTarget: "an empty target is treated as a no-op (pending oracle verification)"
    impl: { module: src/str/core.ts, export: replaceAll }
    status: draft
    vectors: [fixtures/v6/str/replace_all.basic.json]

  - name: substring
    signature:
      params:
        - { name: source, type: string }
        - { name: begin_pos, type: int }
        - { name: end_pos, type: int, default: length of source }
    returns: string
    semantics:
      bounds: "begin inclusive, end exclusive; begin_pos == end_pos yields the empty string"
      errors: "out-of-range positions are a runtime error (Java-strict, pending oracle verification)"
      na: "na source yields na"
    impl: { module: src/str/core.ts, export: substring }
    status: draft
