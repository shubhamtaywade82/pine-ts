name: Publish

on:
  release:
    types: [published]
  # Called by release-please.yml after it creates a release.
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # A release never ships a build that fails its own quality gate.
      - run: pnpm check
      - run: npm publish --access public --provenance --tag ${{ inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
