name: Publish

# Called by release-please.yml only. That file must be the trusted-publisher
# entry on npmjs.com, because trusted publishing validates the calling workflow.
# Publishes with npm trusted publishing (OIDC): no npm token is stored or used.
# The direct release and dispatch triggers were removed; each would make this
# file the caller. Manual runs go through release-please.yml's workflow_dispatch.
on:
  workflow_call:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        required: false
        type: string
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A release never ships a build that fails its own quality gate.
      - run: pnpm check
      - name: Publish to npm (trusted publishing)
        env:
          NPM_DIST_TAG: ${{ inputs.tag || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG" --ignore-scripts
