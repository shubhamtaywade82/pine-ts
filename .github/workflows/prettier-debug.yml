name: Prettier Debug

on:
  push:
    branches: [feat/pine-runtime-foundation-v7]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/core/indicator-cache.ts src/core/node-registry.ts --write
      - run: git diff -- src/core/indicator-cache.ts src/core/node-registry.ts
